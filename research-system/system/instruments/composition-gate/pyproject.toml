[project]
name = "composition_gate"
version = "1.1.0"
description = "Deterministic stage-1 composition-gate screen instrument"
requires-python = ">=3.11"

[project.scripts]
ht-cgate = "composition_gate.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["composition_gate"]
artifacts = ["composition_gate/screen-config.v1.json"]

[tool.hatch.build.targets.wheel.force-include]
"prompts/composition-gate-review.v1.md" = "composition_gate/prompts/composition-gate-review.v1.md"
